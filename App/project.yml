name: SandlotDerby
options:
  bundleIdPrefix: com.m0n01d
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: 5.9

packages:
  DerbyCore:
    path: ../Core

# The one purchase (DESIGN.md §16). The local StoreKit configuration only takes effect when the
# app is launched FROM XCODE: run by `simctl`, `Product.products` comes back empty and the card
# says NOT AVAILABLE (#47 — it used to say NO CONNECTION, which was the wrong word for it). An
# explicit scheme, because the autocreated one cannot carry this.
#
# The path is relative to the REPO ROOT, not to this file: XcodeGen writes the scheme's
# reference with a fixed `../../` in front, which climbs out of `App/SandlotDerby.xcodeproj`
# and out of `App/`. `SandlotDerby.storekit` here would silently point at a file that is not
# there, and the only symptom would be a card that says NOT AVAILABLE inside Xcode too.
#
# `SandlotDerby (Sandbox)` (#47) is the same scheme without `storeKitConfiguration`: a Run from
# Xcode on this one reaches Apple's actual sandbox instead of the local file, which is the only
# way to exercise a real product once `show.contract` exists there (DESIGN.md §16's "Testing the
# purchase"). `scripts/shots.sh` always builds the default scheme by name, so it is untouched.
schemes:
  # W0, the watch spike (docs/watch.md §9, Watch/README.md). Pick it, pick the paired watch as
  # the destination, and Run. It is a watch-only app, so nothing here touches the phone's build.
  DerbyWatchSpike:
    build:
      targets:
        DerbyWatchSpike: all
    run:
      config: Debug
  SandlotDerby:
    build:
      targets:
        SandlotDerby: all
    run:
      config: Debug
      storeKitConfiguration: App/SandlotDerby.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SandlotDerby (Sandbox):
    build:
      targets:
        SandlotDerby: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  SandlotDerby:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: DerbyCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sandlot Derby
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.m0n01d.sandlotderby
        DEVELOPMENT_TEAM: W2E7DTS835
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  # W0 (docs/watch.md §9): a throwaway watch-only spike that measures the glass, the finger, the
  # speaker, the haptics and the battery. Its own bundle id and `WKWatchOnly`, so it is not
  # embedded in the phone app and cannot change it. The real `SandlotDerbyWatch` target (§2)
  # comes at W2 and is embedded then. Shares the three Foundation-only files it needs.
  DerbyWatchSpike:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ../Watch/Sources
      - Sources/PixelCanvas.swift
      - Sources/Palette.swift
      - Sources/Synth.swift
    info:
      path: ../Watch/Info.plist
      properties:
        CFBundleDisplayName: Derby W0
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m0n01d.sandlotderby.watchspike
        DEVELOPMENT_TEAM: W2E7DTS835
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
