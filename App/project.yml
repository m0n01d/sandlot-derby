name: SandlotDerby
options:
  bundleIdPrefix: com.m0n01d
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: 5.9

packages:
  DerbyCore:
    path: ../Core

targets:
  SandlotDerby:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: DerbyCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sandlot Derby
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m0n01d.sandlotderby
        DEVELOPMENT_TEAM: W2E7DTS835
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
